<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devise Madina</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #0b5ed7;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    #splash h1 {
      font-size: 35px;
      margin: 0 0 10px;
    }

    #splash p {
      margin: 0;
      font-size: 16px;
    }

    #app {
      display: none;
      min-height: 100vh;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      padding: 20px;
      text-align: center;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
      max-width: 500px;
      margin: 30px auto;
    }
  </style>
</head>

<body>

  <div id="splash">
    <h1>Devise Madina</h1>
    <p>Chargement...</p>
  </div>

  <div id="app">
    <header>
      <h1>Devise Madina</h1>
    </header>

    <main>
      <div class="box">
        <h2>Bienvenue 👋</h2>
        <p>La plateforme fonctionne.</p>
        <p>Nous allons maintenant reconnecter Supabase.</p>
      </div>
    </main>
  </div>

  <script>
    window.addEventListener("load", function () {

      setTimeout(function () {

        document.getElementById("splash").style.display = "none";
        document.getElementById("app").style.display = "block";

      }, 1000);

    });
  </script>

</body>
</html>
