<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Devise Madina</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f4f7fb;
  color:#172033;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#0758b8;
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
}

.splash-box{
  text-align:center;
  animation:fadeIn 1s ease;
}

.logo-circle{
  width:100px;
  height:100px;
  border-radius:50%;
  background:white;
  color:#0758b8;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:32px;
  font-weight:bold;
}

.splash-box h1{
  margin-top:20px;
  font-size:30px;
}

.splash-box p{
  margin-top:8px;
  opacity:.9;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.9)}
  to{opacity:1;transform:scale(1)}
}

/* HEADER */
header{
  background:#0758b8;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 2px 8px #0002;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.user-menu button{
  background:#ffffff22;
  border:1px solid #ffffff44;
  color:white;
  padding:8px 12px;
  border-radius:8px;
}

/* AUTH */
.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  background:white;
  width:100%;
  max-width:430px;
  padding:25px;
  border-radius:15px;
  box-shadow:0 5px 25px #0001;
}

.auth-box h2{
  color:#0758b8;
  margin-bottom:8px;
}

.auth-box p{
  color:#667085;
  margin-bottom:20px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  outline:none;
  background:white;
}

.field input:focus,
.field select:focus{
  border-color:#0758b8;
}

.primary{
  width:100%;
  border:0;
  background:#0758b8;
  color:white;
  padding:13px;
  border-radius:9px;
  font-weight:bold;
}

.secondary{
  width:100%;
  border:1px solid #0758b8;
  background:white;
  color:#0758b8;
  padding:12px;
  border-radius:9px;
  font-weight:bold;
  margin-top:10px;
}

.small-link{
  text-align:center;
  margin-top:15px;
  color:#0758b8;
  cursor:pointer;
}

/* APP */
#app{
  min-height:100vh;
}

main{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:white;
  border-top:1px solid #ddd;
  display:flex;
  justify-content:center;
  z-index:200;
  box-shadow:0 -2px 10px #0001;
}

.nav-inner{
  width:100%;
  max-width:700px;
  display:flex;
  justify-content:space-around;
}

.nav-btn{
  border:0;
  background:none;
  color:#667085;
  padding:8px 10px;
  font-size:12px;
}

.nav-btn span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.nav-btn.active{
  color:#0758b8;
  font-weight:bold;
}

/* CARDS */
.card{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 3px 15px #0000000d;
}

.card h2{
  margin-bottom:15px;
}

.title{
  font-size:25px;
  font-weight:bold;
  margin-bottom:5px;
}

.subtitle{
  color:#667085;
  margin-bottom:20px;
}

/* RATES */
.rates{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:20px;
}

.rate-card{
  background:#eef6ff;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.rate-card strong{
  display:block;
  color:#0758b8;
  font-size:22px;
  margin-top:5px;
}

.rate-card small{
  color:#667085;
}

/* FORM */
.section-title{
  background:#eef6ff;
  padding:12px;
  border-radius:9px;
  margin:18px 0 15px;
  font-weight:bold;
  color:#0758b8;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.checkbox{
  display:flex;
  gap:8px;
  align-items:center;
  margin:10px 0 15px;
}

.checkbox input{
  width:18px;
  height:18px;
}

.cheque-box{
  background:#fff8e6;
  border:1px solid #f0cf72;
  padding:15px;
  border-radius:10px;
  margin-top:5px;
}

/* ANNOUNCEMENT */
.annonce{
  border:1px solid #e1e5ea;
  border-radius:13px;
  padding:17px;
  margin-bottom:15px;
}

.annonce-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.badge{
  background:#eaf3ff;
  color:#0758b8;
  padding:6px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.money{
  font-size:22px;
  font-weight:bold;
  margin:8px 0;
}

.exchange{
  text-align:center;
  margin:12px 0;
  color:#0758b8;
  font-size:22px
